name: Release (PowerShell Gallery + GitHub Release)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the v prefix, for example 1.2.3"
        required: true
        type: string

  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh # runs with $ErrorActionPreference = 'stop' prepended

env:
  # Base name of the script, the EXE and the PowerShell Gallery package:
  # wsl2compact.ps1 / wsl2compact.exe. Publish-Script derives the package name
  # from the file name, so the script in the repo must carry this name.
  APP_NAME: wsl2compact
  # Directory that holds exactly what gets attested, verified and released.
  DIST_DIR: dist
  # Unsigned files handed to SignPath (uploaded as a GitHub artifact so that
  # SignPath can fetch them itself and verify their origin).
  UNSIGNED_DIR: unsigned
  # Where the SignPath action extracts the signed files.
  SIGNED_DIR: signed
  PS2EXE_VERSION: "1.0.18"
  SIGNPATH_PROJECT_SLUG: WSL-VHDX-Compact
  SIGNPATH_POLICY_SLUG: test-signing
  # 'false' only while using the test-signing policy (untrusted test
  # certificate). Set to 'true' when switching to the release-signing policy.
  REQUIRE_TRUSTED_SIGNATURE: "false"

jobs:
  build:
    name: Build, sign and attest
    runs-on: windows-2025 # SignPath Foundation requires GitHub-hosted runners
    timeout-minutes: 25
    # Secrets/variables used here live in this environment, not at repo level:
    #   secret SIGNPATH_API_TOKEN, secret SIGNPATH_ORGANIZATION_ID
    environment:
      name: build

    permissions:
      contents: read # checkout
      actions: read # SignPath downloads the unsigned artifact from this run
      id-token: write # OIDC token for the attestation
      attestations: write # store the attestation

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce trusted ref for manual runs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: ./.github/scripts/Build.ps1 -Task AssertRef

      - name: Environment info
        run: |
          Write-Host "::group::Environment"
          Write-Host ("PowerShell   : {0}" -f $PSVersionTable.PSVersion)
          Write-Host ("OS           : {0}" -f [Environment]::OSVersion.VersionString)
          Write-Host ("Runner image : {0}" -f $env:ImageOS)
          Write-Host "::endgroup::"

      - name: Compute version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: ./.github/scripts/Build.ps1 -Task ComputeVersion

      - name: Preflight (nothing may exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: ./.github/scripts/Build.ps1 -Task Preflight

      - name: Stamp and validate script version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./.github/scripts/Build.ps1 -Task StampVersion

      - name: Install reviewed ps2exe version
        run: ./.github/scripts/Build.ps1 -Task InstallPs2exe

      - name: Build EXE
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./.github/scripts/Build.ps1 -Task BuildExe

      # --- Signing with origin verification ---------------------------------
      # SignPath must fetch the artifact from this workflow run itself, so the
      # files are uploaded with actions/upload-artifact first. Uploading the
      # folder puts both files at the root of the artifact zip, which is what
      # the SignPath artifact configuration expects.
      - name: Stage files for signing
        run: ./.github/scripts/Build.ps1 -Task StageUnsigned

      - name: Upload unsigned files (SignPath fetches them from GitHub)
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-files
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.UNSIGNED_DIR }}/

      # Waits on an external service, so it gets its own timeout. A
      # release-signing policy with manual approval needs a much larger value
      # (also raise wait-for-completion-timeout-in-seconds, default 600).
      # Pin to the commit SHA of the latest v3 tag, e.g.:
      #   git ls-remote https://github.com/SignPath/github-action-submit-signing-request 'refs/tags/v3*'
      - name: Sign with SignPath (origin-verified, signed files land in signed/)
        timeout-minutes: 15
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ env.SIGNED_DIR }}

      - name: Verify signatures and promote signed files to dist/
        run: ./.github/scripts/Build.ps1 -Task PromoteSigned
      # ----------------------------------------------------------------------

      - name: Generate checksums
        run: ./.github/scripts/Build.ps1 -Task Checksums

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ env.DIST_DIR }}/checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.DIST_DIR }}/

  publish:
    name: Publish packages and GitHub Release
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    # Secret PSGALLERY_API_KEY lives in this environment, not at repo level.
    environment:
      name: release

    permissions:
      contents: write # create the release
      attestations: read # fetch attestations for gh attestation verify

    env:
      # gh needs no git checkout when the repository is given explicitly.
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      # Only the helper scripts, from the exact commit that was built (never a
      # moving branch). The source tree itself is not needed here.
      - name: Check out helper scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: ${{ env.DIST_DIR }}

      - name: Verify checksums
        run: ./.github/scripts/Publish.ps1 -Task VerifyChecksums

      - name: Verify build provenance
        run: ./.github/scripts/Publish.ps1 -Task VerifyAttestation

      - name: Publish to PowerShell Gallery
        id: gallery
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: ./.github/scripts/Publish.ps1 -Task PublishGallery

      - name: Create GitHub Release
        id: release
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
        run: ./.github/scripts/Publish.ps1 -Task CreateRelease

      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GALLERY_OUTCOME: ${{ steps.gallery.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: ./.github/scripts/Publish.ps1 -Task Summary
